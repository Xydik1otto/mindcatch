<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7c6cff">
<meta property="og:title" content="Mindcatch — ADHD mental-load capture">
<meta property="og:description" content="Одне поле — одна думка: локальний офлайн-first капчер думок з triage, pomodoro, тегами і статистикою фокусу.">
<meta property="og:type" content="website">
<meta property="og:image" content="/favicon.svg">
<meta name="twitter:card" content="summary">
<title>Mindcatch</title>
<style>
  :root { --bg:#101418; --card:#1a2027; --fg:#e8ecf1; --muted:#8b95a5; --accent:#7c6cff; --border:#262d38; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; max-width:640px; margin:0 auto; padding:20px; }
  h1 { font-size:1.3rem; }
  .sub { color:var(--muted); font-size:.8rem; margin-bottom:14px; }
  input, button, select { font-size:1rem; border-radius:8px; border:1px solid var(--border); }
  input { width:100%; background:var(--card); color:var(--fg); padding:14px; }
  button { background:var(--accent); color:#fff; border:none; padding:10px 16px; cursor:pointer; }
  button.ghost { background:var(--card); color:var(--fg); border:1px solid var(--border); }
  .capture { display:flex; gap:8px; margin-bottom:16px; }
  .capture input { flex:1; }
  nav { display:flex; gap:6px; margin-bottom:14px; }
  nav button { flex:1; font-size:.85rem; }
  nav button.active { background:var(--accent); }
  nav button:not(.active) { background:var(--card); color:var(--fg); }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .item .type { font-size:.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .item select { background:var(--bg); color:var(--fg); font-size:.75rem; padding:4px; }
  .muted { color:var(--muted); font-size:.8rem; }
  #focus.hidden, #noteEditor.hidden { display:none; }
  #focus { position:fixed; inset:0; background:var(--bg); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; }
  #noteEditor { position:fixed; inset:0; background:var(--bg); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
  #focusTimer { font-size:3rem; font-weight:700; font-variant-numeric:tabular-nums; }
  #tour.hidden { display:none; }
  #tour { position:fixed; inset:0; background:rgba(8,10,14,.6); z-index:20; display:flex; align-items:flex-end; justify-content:center; padding:20px; }
  .tourcard { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; max-width:440px; width:100%; }
  .tourcard h3 { margin:6px 0; font-size:1.05rem; }
  .tourcard p { font-size:.9rem; margin-bottom:12px; }
  .tour-hl { outline:2px solid var(--accent) !important; outline-offset:3px; border-radius:8px; }
  .dropzone { border:2px dashed var(--border); border-radius:10px; padding:18px; text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:14px; }
  .dropzone.over { border-color:var(--accent); color:var(--fg); }
  kbd { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:.75rem; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .skip { position:absolute; left:-9999px; top:0; background:var(--accent); color:#fff; padding:8px 14px; border-radius:0 0 8px 0; z-index:30; }
  .skip:focus { left:0; }
  .exports a { color:var(--accent); }
  a { color:var(--accent); }
  .chip { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:.75rem; cursor:pointer; }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tagbtn { background:none; border:none; color:var(--accent); cursor:pointer; font-size:.75rem; padding:0; }
  .tagedit { display:flex; gap:6px; margin-top:6px; width:100%; }
  .tagedit input { flex:1; padding:6px; font-size:.8rem; }
</style>
</head>
<body>
<a class="skip" href="#list">Перейти до списку задач</a>
<h1>Mindcatch <button id="langBtn" class="ghost" style="font-size:.75rem;padding:6px 10px;vertical-align:middle" aria-label="Змінити мову інтерфейсу">EN</button> <button id="installBtn" class="ghost" style="display:none;font-size:.75rem;padding:6px 10px;vertical-align:middle" aria-label="Встановити застосунок" onclick="installApp()">⬇ Встановити застосунок</button></h1>
<p class="sub" id="subline">Одне поле — одна думка. <kbd>N</kbd> — новий capture, <kbd>T</kbd> — Today, <kbd>F</kbd> — focus, <kbd>E</kbd> — export</p>

<div class="dropzone" id="dropzone">Перетягніть скріншот сюди (OCR, якщо Tesseract встановлений)</div>

<div class="capture">
  <input id="captureInput" placeholder="Що тримаєте в голові? Enter — зберегти" aria-label="Поле швидкого capture" autofocus>
  <button onclick="doCapture()" aria-label="Зберегти capture">↓</button>
</div>

<input id="searchInput" placeholder="🔍 Пошук у всіх задачах і нотатках (архів включно)…" aria-label="Пошук" style="margin-bottom:14px">

<nav>
  <button data-view="inbox" class="active">Inbox</button>
  <button data-view="today">Today</button>
  <button data-view="week">Week</button>
  <button data-view="someday">Someday</button>
  <button data-view="done">Done</button>
  <button data-view="review">Review</button>
  <button data-view="stats">Stats</button>
  <button data-view="calendar">📅 Calendar</button>
  <button data-view="morning">☀ Morning</button>
</nav>

<div id="digest" class="muted" style="margin-bottom:10px"></div>

<div class="exports muted" id="exports" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:.8rem">
  <span data-i18n="exports_label">⬇ Експорт:</span>
  <a href="/api/export" download>JSON</a>
  <a href="/api/export/items.csv" download>CSV</a>
  <a href="/api/export/calendar.ics" download>📅 ICS</a>
  <a href="/api/export/todoist.md" download>Todoist</a>
  <a href="/api/export/markdown" download>Markdown</a>
</div>

<div id="tagChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>
<datalist id="tagDatalist"></datalist>

<div id="list"></div>

<div id="noteEditor" class="hidden" role="dialog" aria-modal="true" aria-label="Редактор нотатки">
  <div class="muted" id="noteTitle"></div>
  <div style="display:flex;gap:10px;width:100%;max-width:640px;height:60vh">
    <textarea id="noteBody" style="flex:1;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;resize:none"></textarea>
    <div id="notePreview" style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto"></div>
  </div>
  <div style="display:flex;gap:10px">
    <button id="noteSave" onclick="saveNoteBody()">Зберегти</button>
    <button id="noteClose" class="ghost" onclick="closeNoteEditor()">Закрити (Esc)</button>
  </div>
</div>

<div id="focus" class="hidden" role="dialog" aria-modal="true" aria-label="Режим фокусу (pomodoro)">
  <div class="muted" id="focusTask"></div>
  <div id="focusTimer">25:00</div>
  <div style="display:flex;gap:10px">
    <button id="focusBtn" onclick="focusAction()">Пауза</button>
    <button class="ghost" onclick="closeFocus()">Закрити (Esc)</button>
  </div>
</div>

<div id="tour" class="hidden" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
  <div class="tourcard">
    <div class="muted" id="tourStep"></div>
    <h3 id="tourTitle"></h3>
    <p id="tourText"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="tourSkip" class="ghost" aria-label="Пропустити огляд">Пропустити</button>
      <button id="tourNext" aria-label="Наступна підказка">Далі →</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
